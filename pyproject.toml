[project]
name = "azerbaijan-chinese-car-market"
version = "0.1.0"
description = "End-to-end data pipeline for Chinese car market analysis in Azerbaijan"
authors = [
    {name = "xeybar heydarov",email = "xeybar.heydarov@gmail.com"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "lxml (>=6.1.1,<7.0.0)",
    "pyarrow (>=14.0.0,<25.0.0)",
    "duckdb (>=1.5.5,<2.0.0)",
    "streamlit (>=1.61.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
